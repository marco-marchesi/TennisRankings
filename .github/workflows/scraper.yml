name: Scraper (weekly)

on:
  schedule:
    # Every Monday at 06:00 UTC — ranking refresh window
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no DB writes)"
        required: false
        default: "true"

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
          SCRAPER_KILL_SWITCH: ${{ vars.SCRAPER_KILL_SWITCH || 'false' }}
          SCRAPER_MAX_DELTA_PCT: ${{ vars.SCRAPER_MAX_DELTA_PCT || '20' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm scraper:run --dry
          else
            pnpm scraper:run
          fi
